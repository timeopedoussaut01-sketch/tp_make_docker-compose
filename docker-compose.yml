services:
  # --- IMAGE MYSQL OFFICIELLE ---
  db:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_DATABASE: company
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - db_data:/var/lib/mysql

  # --- IMAGE PHP (VIA DOCKERFILE) ---
  php:
    build: ./php
    container_name: php-container
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  # --- IMAGE APACHE OFFICIELLE ---
  apache:
    image: httpd:2.4
    container_name: apache-container
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
      - ./apache/my-vhost.conf:/usr/local/apache2/conf/extra/httpd-vhosts.conf
    # Cette commande active les modules nécessaires dans Apache au démarrage
    command: >
      sh -c "sed -i 's/#LoadModule proxy_module/LoadModule proxy_module/' /usr/local/apache2/conf/httpd.conf &&
             sed -i 's/#LoadModule proxy_fcgi_module/LoadModule proxy_fcgi_module/' /usr/local/apache2/conf/httpd.conf &&
             echo 'Include conf/extra/httpd-vhosts.conf' >> /usr/local/apache2/conf/httpd.conf &&
             httpd-foreground"
    depends_on:
      - php

# Définition du volume nommé pour MySQL (évite de perdre les données)
volumes:
  db_data:
