<VirtualHost *:80>
    DocumentRoot /var/www/html
    
    <Directory /var/www/html>
        DirectoryIndex index.php
        AllowOverride All
        Require all granted
    </Directory>

    # Connexion au conteneur PHP via le port 9000
    <FilesMatch \.php$>
        SetHandler "proxy:fcgi://php-container:9000"
    </FilesMatch>
</VirtualHost>
